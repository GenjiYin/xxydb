[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xxydb"
version = "0.1.8"
description = "轻量 A 股数据库封装，基于 Parquet (Hive 分区) + DuckDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
ai = ["openai"]

[project.urls]
Homepage = "https://github.com/xxydb/xxydb"

[tool.hatch.build.targets.wheel]
packages = ["src/xxydb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
